services:
  bouncer-services-proxy:
    image: node:lts
    ports:
      - 80:80
      - 443:443
      - 9229:9229
    volumes:
      - .:/usr/dev
    working_dir: /usr/dev
    command: npm --workspace @zthun/bouncer-cli run debug
    depends_on:
      - bouncer-mongo-admin
      - bouncer-email
      - bouncer-web
  bouncer-web:
    image: node:lts
    volumes:
      - .:/usr/dev
    working_dir: /usr/dev
    command: npm --workspace @zthun/bouncer-web run debug
  bouncer-mongo:
    image: mongo:noble
  bouncer-mongo-admin:
    image: mongo-express:latest
    depends_on:
      - bouncer-mongo
    environment:
      - ME_CONFIG_MONGODB_SERVER=bouncer-mongo
  bouncer-email:
    image: rnwood/smtp4dev:latest
